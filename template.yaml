AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lapse — Serverless document expiry reminder.
  AWS Weekend Challenge: "No Pipeline, No Problem"

Parameters:
  SenderEmail:
    Type: String
    Default: noreply@lapse.local
    Description: SES-verified sender email address
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: >
      Vision-capable Amazon Bedrock model ID or inference profile (must accept image
      and PDF input). Default: Amazon Nova Lite, the cheapest Amazon model that reads images.
  DemoMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Shrinks waits to seconds/minutes for live demo
  LeadDays:
    Type: Number
    Default: 30
    Description: Days before expiry to send the first reminder
  LocalMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable local fallback for Bedrock when running in LocalStack
  EnableCdn:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Serve the page through CloudFront (new AWS accounts must be verified by AWS Support first). Otherwise it is served over HTTPS by the API itself.
  VapidPublicKey:
    Type: String
    Default: ""
    Description: Web Push public key from scripts/setup_push.py. Empty turns browser notifications off.
  VapidPrivateKeyParam:
    Type: String
    Default: /lapse/vapid-private-key
    Description: SSM SecureString holding the Web Push private key (created by scripts/setup_push.py)
  AppUrl:
    Type: String
    Default: ""
    Description: >
      Where the web page is served; sign-in links point here. Leave empty to use the
      S3 website URL. For local development use https://127.0.0.1:8443.
  LambdaArchitecture:
    Type: String
    Default: arm64
    AllowedValues: ["arm64", "x86_64"]
    Description: Lambda CPU architecture (arm64 recommended on AWS)

Conditions:
  HasAppUrl: !Not [!Equals [!Ref AppUrl, ""]]
  IsLocal: !Equals [!Ref LocalMode, "true"]
  # LocalStack has no CloudFront: locally the bucket stays a public S3 website.
  UseCdn: !And [!Not [!Condition IsLocal], !Equals [!Ref EnableCdn, "true"]]
  HasPush: !Not [!Equals [!Ref VapidPublicKey, ""]]
  NeedsWebBucketPolicy: !Or [!Condition IsLocal, !Condition UseCdn]

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - !Ref LambdaArchitecture
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref LapseTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        SENDER_EMAIL: !Ref SenderEmail
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        DEMO_MODE: !Ref DemoMode
        LEAD_DAYS: !Ref LeadDays
        LOCAL_MODE: !Ref LocalMode

Resources:
  # ---------------------------------------------------------------------------
  # Storage & Data (Milestone 2)
  # ---------------------------------------------------------------------------
  LapseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3600
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      # Documents are deleted right after extraction (D27); this is the backstop.
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadsAfterOneDay
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # On AWS the bucket is private and the page is served over HTTPS, by the API
  # (GET /) or, with EnableCdn, by CloudFront (D29). Locally it is a public S3
  # website, since LocalStack has no CloudFront.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration: !If
        - IsLocal
        - IndexDocument: index.html
        - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: !If [IsLocal, false, true]
        RestrictPublicBuckets: !If [IsLocal, false, true]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: NeedsWebBucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - IsLocal
            - Sid: PublicReadForStaticSite
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "${WebBucket.Arn}/*"
            - Sid: CloudFrontReadOnly
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${WebBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCdn
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCdn
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Lapse web app (${AWS::StackName})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized"; index.html is uploaded with no-cache and
          # deploy_web.py invalidates it, so new versions show up at once.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed "SecurityHeadersPolicy": HSTS, nosniff, frame DENY, strict referrer.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

  # ---------------------------------------------------------------------------
  # HTTP API Gateway (D18)
  # ---------------------------------------------------------------------------
  LapseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ---------------------------------------------------------------------------
  # Workflow Lambdas
  # ---------------------------------------------------------------------------
  ExtractDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.extract_document.handler
      CodeUri: src/
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - S3ReadPolicy:
            BucketName: !Ref UploadsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - textract:DetectDocumentText
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "${UploadsBucket.Arn}/uploads/*"

  ComputeReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.compute_reminder.handler
      CodeUri: src/

  SendReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.send_reminder.handler
      CodeUri: src/
      Layers: !If [HasPush, [!Ref PushLayer], !Ref AWS::NoValue]
      Environment:
        Variables:
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY_PARAM: !Ref VapidPrivateKeyParam
          API_BASE_URL: !Sub "https://${LapseApi}.execute-api.${AWS::Region}.amazonaws.com"
          APP_URL: !If
            - HasAppUrl
            - !Ref AppUrl
            - !If
              - UseCdn
              - !Sub "https://${WebDistribution.DomainName}"
              # Empty: the handler uses the API's own HTTPS address, which serves the page.
              - !If [IsLocal, !GetAtt WebBucket.WebsiteURL, ""]
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              # VapidPrivateKeyParam starts with "/", e.g. /lapse/vapid-private-key
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VapidPrivateKeyParam}"
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - SESCrudPolicy:
            IdentityName: "*"

  # ---------------------------------------------------------------------------
  # Step Functions Standard Workflow (D1, D2, D3, D13)
  # ---------------------------------------------------------------------------
  LapseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      # Fixed name so AddOrUpdateItemFunction can build the ARN without a Ref.
      # A Ref would close a loop: API -> AddOrUpdateItem -> state machine ->
      # SendReminder -> API URL.
      Name: !Sub "${AWS::StackName}-lapse"
      Type: STANDARD
      DefinitionUri: statemachine/lapse.asl.json
      DefinitionSubstitutions:
        TableName: !Ref LapseTable
        ExtractDocumentFunctionArn: !GetAtt ExtractDocumentFunction.Arn
        ComputeReminderFunctionArn: !GetAtt ComputeReminderFunction.Arn
        SendReminderFunctionArn: !GetAtt SendReminderFunction.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractDocumentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ComputeReminderFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SendReminderFunction
        - Statement:
            Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"

  # ---------------------------------------------------------------------------
  # EventBridge Rule: S3 Upload -> Step Functions (D7)
  # ---------------------------------------------------------------------------
  S3UploadEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref UploadsBucket
          object:
            key:
              - prefix: uploads/
      Targets:
        - Arn: !Ref LapseStateMachine
          Id: StartLapseWorkflow
          RoleArn: !GetAtt EventBridgeStepFunctionsRole.Arn

  EventBridgeStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartLapseStateMachine
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref LapseStateMachine

  # ---------------------------------------------------------------------------
  # API Lambdas (D20 least-privilege)
  # ---------------------------------------------------------------------------
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.auth.handler
      CodeUri: src/
      Environment:
        Variables:
          APP_URL: !If
            - HasAppUrl
            - !Ref AppUrl
            - !If
              - UseCdn
              - !Sub "https://${WebDistribution.DomainName}"
              # Empty: the handler uses the API's own HTTPS address, which serves the page.
              - !If [IsLocal, !GetAtt WebBucket.WebsiteURL, ""]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - SESCrudPolicy:
            IdentityName: "*"
      Events:
        AuthStart:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /auth/start
            Method: POST
        AuthVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /auth/verify
            Method: POST
        AuthLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /auth/logout
            Method: POST

  WebPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.web_page.handler
      CodeUri: src/
      MemorySize: 128
      Environment:
        Variables:
          WEB_BUCKET: !Ref WebBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref WebBucket
      Events:
        WebRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /
            Method: GET
        ServiceWorker:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /sw.js
            Method: GET
        Manifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /manifest.webmanifest
            Method: GET
        Icon192:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /icon-192.png
            Method: GET
        Icon512:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /icon-512.png
            Method: GET
        AppleTouchIcon:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /apple-touch-icon.png
            Method: GET

  # cryptography for Web Push, built by scripts/build_push_layer.py (D31)
  PushLayer:
    Type: AWS::Serverless::LayerVersion
    Condition: HasPush
    Properties:
      ContentUri: layers/push/
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [!Ref LambdaArchitecture]

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.push.handler
      CodeUri: src/
      Layers: !If [HasPush, [!Ref PushLayer], !Ref AWS::NoValue]
      Environment:
        Variables:
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY_PARAM: !Ref VapidPrivateKeyParam
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              # VapidPrivateKeyParam starts with "/", e.g. /lapse/vapid-private-key
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VapidPrivateKeyParam}"
      Events:
        Subscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /push/subscribe
            Method: POST
        Unsubscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /push/unsubscribe
            Method: POST
        TestPush:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /push/test
            Method: POST

  CalendarFeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.calendar_feed.handler
      CodeUri: src/
      Environment:
        Variables:
          APP_URL: !If
            - HasAppUrl
            - !Ref AppUrl
            - !If
              - UseCdn
              - !Sub "https://${WebDistribution.DomainName}"
              # Empty: the handler uses the API's own HTTPS address, which serves the page.
              - !If [IsLocal, !GetAtt WebBucket.WebsiteURL, ""]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
      Events:
        CreateFeedLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /calendar-feed
            Method: POST
        FeedLinkStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /calendar-feed
            Method: GET
        ServeFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /calendar/{token}
            Method: GET

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_upload_url.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - S3WritePolicy:
            BucketName: !Ref UploadsBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /upload-url
            Method: GET

  ListItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.list_items.handler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LapseTable
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /items
            Method: GET

  AddOrUpdateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.add_or_update_item.handler
      CodeUri: src/
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-lapse"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !Sub "${AWS::StackName}-lapse"
      Events:
        AddOrUpdateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /items
            Method: POST

  DeleteItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.delete_item.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
      Events:
        DeleteItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /items/{itemId}
            Method: DELETE

  ActionHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.action_handler.handler
      CodeUri: src/
      Environment:
        Variables:
          APP_URL: !If
            - HasAppUrl
            - !Ref AppUrl
            - !If
              - UseCdn
              - !Sub "https://${WebDistribution.DomainName}"
              # Empty: the handler uses the API's own HTTPS address, which serves the page.
              - !If [IsLocal, !GetAtt WebBucket.WebsiteURL, ""]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LapseTable
        - Statement:
            Effect: Allow
            Action:
              - states:SendTaskSuccess
            Resource: "*"
      Events:
        GetAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /action
            Method: GET
        PostAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref LapseApi
            Path: /action
            Method: POST

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${LapseApi}.execute-api.${AWS::Region}.amazonaws.com"
  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref LapseStateMachine
  TableName:
    Description: DynamoDB table name
    Value: !Ref LapseTable
  UploadsBucketName:
    Description: S3 bucket for uploaded documents
    Value: !Ref UploadsBucket
  WebBucketName:
    Description: S3 bucket for static frontend
    Value: !Ref WebBucket
  WebUrl:
    Description: Address of the web app (HTTPS on AWS)
    Value: !If
      - UseCdn
      - !Sub "https://${WebDistribution.DomainName}"
      - !If [IsLocal, !GetAtt WebBucket.WebsiteURL, !Sub "https://${LapseApi}.execute-api.${AWS::Region}.amazonaws.com/"]
  VapidPublicKey:
    Description: Web Push public key baked into the page (empty = push off)
    Value: !Ref VapidPublicKey
  WebDistributionId:
    Condition: UseCdn
    Description: CloudFront distribution serving the web app
    Value: !Ref WebDistribution
